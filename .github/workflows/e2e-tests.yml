name: E2E Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Escolha o navegador de sua preferência para os testes (chromium, firefox, webkit)'
        required: true
        default: 'chromium'
      base_url:
        description: 'Escolha o ambiente de testes de sua preferência (local, homolog, production)'
        required: true
        default: 'http//localhost:3000'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Node Setup
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ github.event.inputs.browser }}

      - name: Run E2E tests
        run: BASE_URL=${{ github.event.inputs.env }} npx playwright test --project=${{ github.event.inputs.browser }}

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.event.inputs.browser }}
          path: playwright-report/
          retention-days: 30
